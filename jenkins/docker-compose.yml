services:
  jenkins:
    build: .
    image: jenkins-docker:local
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID}"
    environment:
      JAVA_OPTS: "-Xmx768m"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ala/ecommerce/deploy:/home/ala/ecommerce/deploy:ro
    ports:
      - "192.168.47.148:8088:8080"

volumes:
  jenkins-home:
